name: Release

on:
  workflow_dispatch:
    inputs:
      abi:
        description: 'ABI for adb install (arm64-v8a, armeabi-v7a, x86_64). Release artifacts always include every ABI + universal.'
        required: true
        default: 'x86_64'
      device:
        description: 'adb device host:port'
        required: false
        default: ''
      create_release:
        description: 'Publish a GitHub release with the renamed APKs'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    if: ${{ github.ref == 'refs/heads/main' }}

  build-and-install:
    needs: checks
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Restore Gradle cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode release keystore
        run: |
          set -euo pipefail
          : "${KEYSTORE_B64:?KEYSTORE_B64 secret is not set}"
          : "${KEYSTORE_PASSWORD:?KEYSTORE_PASSWORD secret is not set}"
          : "${KEY_ALIAS:?KEY_ALIAS secret is not set}"
          : "${KEY_PASSWORD:?KEY_PASSWORD secret is not set}"
          echo "${KEYSTORE_B64}" | base64 -d > ./release-keystore.jks
          echo "storeFile=release-keystore.jks" > local.properties
          echo "storePassword=${KEYSTORE_PASSWORD}" >> local.properties
          echo "keyAlias=${KEY_ALIAS}" >> local.properties
          echo "keyPassword=${KEY_PASSWORD}" >> local.properties
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Assemble Release APK
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Rename APKs
        id: rename
        run: |
          set -euo pipefail
          apk_dir=app/build/outputs/apk/release
          shopt -s nullglob
          echo "Contents after assemble:"; ls -la "$apk_dir"
          for apk in "$apk_dir"/app-*-release.apk; do
            mv -f "$apk" "$apk_dir/grabbit-${apk##*/app-}"
          done
          if compgen -G "$apk_dir"/app-*-release-unsigned.apk >/dev/null; then
            echo "Unsigned APK produced; refusing release" >&2
            ls -la "$apk_dir" >&2
            exit 1
          fi
          if compgen -G "$apk_dir"/app-*-release-unsigned >/dev/null; then
            echo "Unsigned APK produced; refusing release" >&2
            ls -la "$apk_dir" >&2
            exit 1
          fi
          echo "Contents after rename:"; ls -la "$apk_dir"
          echo "APK_PATH=$apk_dir/grabbit-${{ inputs.abi }}-release.apk" >> "$GITHUB_OUTPUT"

      - name: Generate SHA-256 checksums
        id: checksums
        run: |
          set -euo pipefail
          apk_dir=app/build/outputs/apk/release
          cd "$apk_dir"
          apks=(
            grabbit-arm64-v8a-release.apk
            grabbit-armeabi-v7a-release.apk
            grabbit-universal-release.apk
            grabbit-x86_64-release.apk
          )
          for apk in "${apks[@]}"; do
            if [[ ! -f "$apk" ]]; then
              echo "Missing $apk" >&2
              ls -la >&2
              exit 1
            fi
          done
          sha256sum "${apks[@]}" | LC_ALL=C sort > sha256sums.txt
          sha256sum -c sha256sums.txt

      - name: Verify APK signatures
        run: |
          set -euo pipefail
          apk_dir=app/build/outputs/apk/release
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$sdk_root" || ! -d "$sdk_root/build-tools" ]]; then
            echo "Android build-tools not found" >&2
            exit 1
          fi
          apksigner="$(find "$sdk_root/build-tools" -maxdepth 2 -type f -name apksigner | LC_ALL=C sort -V | tail -n 1)"
          if [[ -z "$apksigner" ]]; then
            echo "apksigner not found" >&2
            exit 1
          fi
          "$apksigner" verify --print-certs "$apk_dir/grabbit-arm64-v8a-release.apk"
          "$apksigner" verify --print-certs "$apk_dir/grabbit-armeabi-v7a-release.apk"
          "$apksigner" verify --print-certs "$apk_dir/grabbit-universal-release.apk"
          "$apksigner" verify --print-certs "$apk_dir/grabbit-x86_64-release.apk"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: grabbit-apks
          path: |
            app/build/outputs/apk/release/grabbit-arm64-v8a-release.apk
            app/build/outputs/apk/release/grabbit-armeabi-v7a-release.apk
            app/build/outputs/apk/release/grabbit-universal-release.apk
            app/build/outputs/apk/release/grabbit-x86_64-release.apk
            app/build/outputs/apk/release/sha256sums.txt

      - name: Publish GitHub release
        if: ${{ inputs.create_release && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          major=$(grep '^MAJOR=' version.properties | cut -d= -f2)
          minor=$(grep '^MINOR=' version.properties | cut -d= -f2)
          build=$(grep '^BUILD=' version.properties | cut -d= -f2)
          tag="v${major}.${minor}.${build}"
          title="Grabbit ${tag}"
          apk_dir=app/build/outputs/apk/release

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub release $tag already exists" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "git tag $tag already exists" >&2
            exit 1
          fi

          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -X POST \
            -f tag_name="$tag" \
            -f target_commitish=main \
            -q .body > generated-notes.md

          {
            if ! grep -qxF "## What's Changed" generated-notes.md; then
              printf "## What's Changed\n\n"
            fi
            cat generated-notes.md
            printf '\n## Release assets\n\n'
            printf '%s\n' \
              '- `grabbit-arm64-v8a-release.apk` — arm64-v8a' \
              '- `grabbit-armeabi-v7a-release.apk` — armeabi-v7a' \
              '- `grabbit-x86_64-release.apk` — x86_64' \
              '- `grabbit-universal-release.apk` — universal (all supported ABIs)' \
              '- `sha256sums.txt` — SHA-256 checksums for every APK' \
              '' \
              'All APKs are signed, R8-minified (`shrinkResources`). Verify with `sha256sum -c sha256sums.txt`.'
            printf '\n## SHA-256\n```\n'
            cat "$apk_dir/sha256sums.txt"
            printf '```\n'
          } > notes.md

          gh release create "$tag" \
            "$apk_dir/grabbit-arm64-v8a-release.apk" \
            "$apk_dir/grabbit-armeabi-v7a-release.apk" \
            "$apk_dir/grabbit-universal-release.apk" \
            "$apk_dir/grabbit-x86_64-release.apk" \
            "$apk_dir/sha256sums.txt" \
            --title "$title" \
            --notes-file notes.md \
            --target main

          echo "Published $title"
          gh release view "$tag" --json tagName,name,isDraft,isPrerelease,targetCommitish,url,assets,body

      - name: Install on device via adb
        if: ${{ inputs.device != '' }}
        run: |
          sudo apt-get update -y && sudo apt-get install -y android-tools-adb
          adb connect "${{ inputs.device }}"
          adb -s "${{ inputs.device }}" install -r -d ${{ steps.rename.outputs.APK_PATH }}
